<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/images/favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/images/favicon-16x16.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo.png?v=1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo-dark.png?v=1" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/frontend/assets/images/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/apple-touch-icon.png?v=1">
<meta name="theme-color" content="#091020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">
<link rel="stylesheet" href="/frontend/shared/css/login-loader.css">
<link rel="preload" as="image" href="/frontend/assets/images/loader-bg.jpg">
<script src="/frontend/shared/js/login-loader.js" defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:var(--bg-primary);font-family:"Poppins",sans-serif;color:var(--text-primary);display:flex;align-items:center;justify-content:center;overflow-x:hidden;}

.register-box{width:100%;max-width:420px;padding:40px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:24px;backdrop-filter:blur(20px);margin:40px 20px;position:relative;z-index:2;}
.logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:30px;}
.logo-icon{width:56px;height:56px;border-radius:16px;object-fit:cover;flex-shrink:0;}
.logo-text h1{font-size:1.3rem;font-weight:700;color:var(--text-primary);}
.logo-text p{font-size:0.75rem;color:var(--text-secondary);}
.welcome{text-align:center;margin-bottom:28px;}
.welcome h2{font-size:1.4rem;font-weight:600;margin-bottom:4px;}
.welcome p{font-size:0.85rem;color:var(--text-secondary);}

.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:0.8rem;font-weight:500;color:var(--text-secondary);margin-bottom:6px;}
.form-group input{width:100%;padding:13px 16px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-family:inherit;font-size:0.92rem;transition:all 0.3s;outline:none;}
.form-group input:focus{border-color:var(--accent-primary);box-shadow:var(--glow);}
.form-group input::placeholder{color:var(--text-secondary);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.3s;}
.btn-primary{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#0a0e1a;margin-bottom:12px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,255,0.25);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.error{background:color-mix(in srgb,var(--danger) 9%,transparent);border:1px solid color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger);padding:10px 14px;border-radius:10px;font-size:0.82rem;margin-bottom:14px;display:none;}
.success{background:color-mix(in srgb,var(--success) 9%,transparent);border:1px solid color-mix(in srgb,var(--success) 22%,transparent);color:var(--success);padding:10px 14px;border-radius:10px;font-size:0.82rem;margin-bottom:14px;display:none;}

.links{text-align:center;margin-top:18px;font-size:0.82rem;color:var(--text-secondary);}
.links a{color:var(--accent-primary);text-decoration:none;font-weight:500;}
.links a:hover{text-decoration:underline;}

.particle{position:fixed;background:color-mix(in srgb,var(--accent-primary) 18%,transparent);border-radius:50%;pointer-events:none;animation:pfloat 12s linear infinite;}
@keyframes pfloat{0%{transform:translateY(0) scale(1);opacity:0.4;}50%{transform:translateY(-60px) scale(1.2);opacity:0.7;}100%{transform:translateY(0) scale(1);opacity:0.3;}}
</style>
<script type="module" src="/frontend/shared/js/pwa.js"></script>
</head>
<body>

<div class="register-box">
  <div class="logo">
    <img class="logo-icon brand-logo-light" src="/frontend/assets/images/logo.png" alt="Smart Waste Segregator logo" width="56" height="56">
    <img class="logo-icon brand-logo-dark" src="/frontend/assets/images/logo-dark.png" alt="Smart Waste Segregator logo" width="56" height="56">
    <div class="logo-text">
      <h1>Smart Waste Segregator</h1>
      <p>Monitoring System</p>
    </div>
  </div>

  <div class="welcome">
    <h2>Create Account</h2>
    <p>Join the smart waste management system</p>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <form id="registerForm" onsubmit="return handleRegister(event)">
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="johndoe" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="john@example.com" required>
    </div>
    <div class="form-group">
      <label>Password (min 6 characters)</label>
      <input type="password" id="password" placeholder="Create a password" required minlength="6">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="regBtn">Create Account</button>
  </form>

  <div class="links">
    Already have an account? <a href="/">Sign in</a>
  </div>
</div>

<script>
for(var i=0;i<15;i++){var p=document.createElement('div');p.className='particle';var s=2+Math.random()*5;p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'vw;top:'+Math.random()*100+'vh;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:'+Math.random()*5+'s;';document.body.appendChild(p);}

var regInFlight = false;

function handleRegister(e) {
  e.preventDefault();
  if (regInFlight) return false; // hard guard against duplicate submissions
  var errorEl = document.getElementById('error');
  var successEl = document.getElementById('success');
  var btn = document.getElementById('regBtn');

  errorEl.style.display = 'none';
  successEl.style.display = 'none';

  var pw = document.getElementById('password').value;
  var cpw = document.getElementById('confirmPassword').value;
  if (pw !== cpw) {
    errorEl.textContent = 'Passwords do not match';
    errorEl.style.display = 'block';
    return false;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account...';
  regInFlight = true;

  var data = {
    fullName: document.getElementById('fullName').value.trim(),
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: pw
  };

  fetch('/api/auth/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  })
  .then(function(res) { return res.json().then(function(j) { return {ok: res.ok, data: j}; }); })
  .then(function(res) {
    if (res.ok) {
      var nu = res.data.user || { username: document.getElementById('username').value.trim(),
                                 fullName: document.getElementById('fullName').value.trim() };
      // Sign the new account in silently so the loader can run its real flow.
      return fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: data.username, password: pw }),
        credentials: 'include'
      })
        .then(function(lr) { return lr.ok ? lr.json() : null; })
        .then(function(ld) {
          window.showLoginLoader({
            user: (ld && ld.user) || nu,
            register: true,
            dest: '/dashboard.html',
            initialStatus: 'Creating your account...'
          });
        })
        .catch(function() {
          window.showLoginLoader({
            user: nu,
            register: true,
            dest: '/dashboard.html',
            initialStatus: 'Creating your account...'
          });
        });
    } else {
      errorEl.textContent = res.data.error || 'Registration failed';
      errorEl.style.display = 'block';
      regInFlight = false;
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  })
  .catch(function(err) {
    errorEl.textContent = 'Server not reachable. Make sure Flask is running.';
    errorEl.style.display = 'block';
    regInFlight = false;
    btn.disabled = false;
    btn.textContent = 'Create Account';
  });

  return false;
}
</script>
<script src="/frontend/shared/js/emailjs-config.js"></script>
<script src="/frontend/shared/js/chat-widget.js"></script>
<script type="module" src="/frontend/shared/js/theme-switcher.js"></script>
</body>
</html>
