<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/images/favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/images/favicon-16x16.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo.png?v=1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo-dark.png?v=1" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/frontend/assets/images/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/apple-touch-icon.png?v=1">
<meta name="theme-color" content="#091020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.notifications-container {
  max-width: 800px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.page-header h1 {
  font-size: 2rem;
}

.header-actions {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 10px 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn:hover {
  background: var(--border-color);
}

.notifications-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.notification-item {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  gap: 15px;
  align-items: start;
  transition: all 0.3s ease;
  cursor: pointer;
}

.notification-item:hover {
  background: var(--bg-secondary);
  transform: translateX(5px);
}

.notification-item.unread {
  border-left: 4px solid #00d4ff;
  background: rgba(0, 212, 255, 0.1);
}

.notification-icon {
  font-size: 2rem;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-secondary);
  border-radius: 12px;
  flex-shrink: 0;
}

.notification-content {
  flex: 1;
}

.notification-content h3 {
  font-size: 1.1rem;
  margin-bottom: 5px;
}

.notification-content p {
  opacity: 0.8;
  font-size: 0.95rem;
}

.notification-time {
  font-size: 0.85rem;
  opacity: 0.6;
  margin-top: 8px;
}

.notification-actions {
  display: flex;
  gap: 10px;
}

.action-btn {
  padding: 5px 10px;
  background: var(--bg-secondary);
  border: none;
  border-radius: 6px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 0.85rem;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  opacity: 0.6;
}

.empty-state .icon {
  font-size: 4rem;
  margin-bottom: 20px;
}

.unread-count {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-left: 10px;
  font-weight: 600;
}

.unread-count.has-unread {
  color: var(--accent-primary);
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:var(--bg-card);backdrop-filter:blur(20px);border-right:1px solid var(--border-color);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:var(--bg-secondary);color:var(--text-primary);}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:var(--accent-primary);font-weight:500;border-left:3px solid var(--accent-primary);}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:var(--bg-secondary);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="notifications-container">
  <div class="page-header">
    <h1>🔔 Notifications<span class="unread-count" id="notifUnreadCount">– unread</span></h1>
    <div class="header-actions">
      <button class="btn" onclick="markAllAsRead()">✓ Mark all as read</button>
      <button class="btn" onclick="clearAll()">🗑️ Clear all</button>
    </div>
  </div>

  <div class="notifications-list" id="notificationsList">
    <div class="empty-state">
      <div class="icon">🔔</div>
      <h3>No notifications yet</h3>
      <p>You'll be notified when bins need attention</p>
    </div>
  </div>
</div>

<script>
// Persisted notifications — read/unread/delete are backed by the activity table
var notificationsData = [];
var unreadCountEl = document.getElementById('notifUnreadCount');

function refreshUnread() {
  var n = notificationsData.filter(function(nd) { return !nd.read && !nd._deleted; }).length;
  if (unreadCountEl) {
    unreadCountEl.textContent = n + (n === 1 ? ' unread' : ' unread');
    unreadCountEl.className = 'unread-count' + (n > 0 ? ' has-unread' : '');
  }
}

function mapActivity(act) {
  var message = act.message || act.action || 'System notification';
  var type = 'info';
  var m = message.toLowerCase();
  if (m.indexOf('alert') >= 0 || m.indexOf('full') >= 0 || m.indexOf('please empty') >= 0) type = 'alert';
  else if (m.indexOf('badge') >= 0) type = 'badge';
  else if (m.indexOf('reset') >= 0 || m.indexOf('empty') >= 0 || m.indexOf('collected') >= 0) type = 'success';
  else if (m.indexOf('warning') >= 0 || m.indexOf('high') >= 0) type = 'warning';

  return {
    id: act.id,
    type: type,
    message: message,
    bin: act.bin || '',
    level: act.level || null,
    timestamp: act.timestamp || new Date().toISOString(),
    read: !!act.read,
    _deleted: false
  };
}

async function loadNotifications() {
  try {
    var res = await fetch('/api/notifications?limit=30', { credentials: 'include' });
    var activities = [];
    if (res.ok) {
      activities = await res.json();
    }

    var notificationsList = document.getElementById('notificationsList');

    if (Array.isArray(activities) && activities.length > 0) {
      notificationsData = activities.map(mapActivity);
    } else {
      notificationsData = [];
    }
    renderNotifications();
    refreshUnread();
  } catch (error) {
    console.error('Error loading notifications:', error);
  }
}

function renderNotifications() {
  var notificationsList = document.getElementById('notificationsList');
  notificationsList.innerHTML = '';

  var visibleNotifs = notificationsData.filter(function(n) { return !n._deleted; });

  if (visibleNotifs.length === 0) {
    notificationsList.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🔔</div>' +
        '<h3>No notifications yet</h3>' +
        '<p>You\'ll be notified when bins need attention</p>' +
      '</div>';
    return;
  }

  visibleNotifs.forEach(function(notif) {
    var item = createNotificationItem(notif);
    notificationsList.appendChild(item);
  });
}

function createNotificationItem(notif) {
  var div = document.createElement('div');
  div.className = 'notification-item' + (notif.read ? '' : ' unread');

  var iconMap = {
    'alert': '⚠️',
    'badge': '🏅',
    'info': 'ℹ️',
    'success': '✅',
    'warning': '⚡'
  };

  var timeAgo = getTimeAgo(notif.timestamp);

  div.innerHTML =
    '<div class="notification-icon">' + (iconMap[notif.type] || '🔔') + '</div>' +
    '<div class="notification-content">' +
      '<h3>' + notif.message + '</h3>' +
      '<p>' + (notif.bin ? notif.bin.toUpperCase() + ' bin - ' : '') + (notif.level ? notif.level + '% full' : '') + '</p>' +
      '<div class="notification-time">' + timeAgo + '</div>' +
    '</div>' +
    '<div class="notification-actions">' +
      (!notif.read ? '<button class="action-btn" onclick="markAsRead(\'' + notif.id + '\')">Mark read</button>' : '') +
      '<button class="action-btn" onclick="deleteNotification(\'' + notif.id + '\')">Delete</button>' +
    '</div>';

  return div;
}

function getTimeAgo(timestamp) {
  var now = new Date();
  var time = new Date(timestamp);
  var diff = Math.floor((now - time) / 1000);

  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff / 60) + ' minutes ago';
  if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
  return Math.floor(diff / 86400) + ' days ago';
}

window.markAsRead = function(id) {
  fetch('/api/notifications/' + id + '/read', { method: 'POST', credentials: 'include' }).catch(function() {});
  notificationsData.forEach(function(n) {
    if (n.id === id) n.read = true;
  });
  renderNotifications();
  refreshUnread();
};

window.deleteNotification = function(id) {
  fetch('/api/notifications/' + id, { method: 'DELETE', credentials: 'include' }).catch(function() {});
  notificationsData.forEach(function(n) {
    if (n.id === id) n._deleted = true;
  });
  renderNotifications();
  refreshUnread();
};

window.markAllAsRead = function() {
  fetch('/api/notifications/read-all', { method: 'POST', credentials: 'include' }).catch(function() {});
  notificationsData.forEach(function(n) {
    n.read = true;
  });
  renderNotifications();
  refreshUnread();
};

window.clearAll = function() {
  if (confirm('Clear all notifications?')) {
    fetch('/api/notifications/clear-all', { method: 'DELETE', credentials: 'include' }).catch(function() {});
    notificationsData = [];
    renderNotifications();
    refreshUnread();
  }
};

// Live updates from the server
var socket = io();
socket.on('notification_new', function(ntf) {
  if (!ntf || notificationsData.some(function(n) { return n.id === ntf.id; })) return;
  var notif = mapActivity({
    id: ntf.id, event_type: ntf.event_type, message: ntf.message,
    data: ntf.data, timestamp: ntf.timestamp, read: 0
  });
  notificationsData.unshift(notif);
  if (notificationsData.length > 30) notificationsData.pop();
  renderNotifications();
  refreshUnread();
});

loadNotifications();
setInterval(loadNotifications, 30000); // Refresh every 30 seconds
</script>

<script type="module" src="/frontend/shared/js/theme-switcher.js"></script>
</body>
</html>
