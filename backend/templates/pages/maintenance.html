<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/images/favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/images/favicon-16x16.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo.png?v=1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo-dark.png?v=1" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/frontend/assets/images/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/apple-touch-icon.png?v=1">
<meta name="theme-color" content="#091020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.maintenance-container {
  max-width: 1200px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 20px;
}

.page-header h1 {
  font-size: 2.5rem;
}

.report-btn {
  padding: 14px 30px;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  border: none;
  border-radius: 12px;
  color: #111;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.report-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
}

.status-line {
  border-radius: 12px;
  padding: 14px 20px;
  margin-bottom: 20px;
  font-size: 0.95rem;
  display: none;
}

.status-line.ok { display: block; background: rgba(0, 255, 153, 0.12); border: 1px solid rgba(0, 255, 153, 0.4); color: #00ff99; }
.status-line.err { display: block; background: rgba(255, 68, 68, 0.12); border: 1px solid rgba(255, 68, 68, 0.4); color: #ff6b6b; }

.stats-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--success);
  margin: 10px 0;
}

.maintenance-log {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 30px;
}

.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
  gap: 15px;
}

.filter-tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.tab {
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9rem;
}

.tab:hover,
.tab.active {
  background: rgba(0, 212, 255, 0.2);
  border-color: #00d4ff;
}

.log-timeline {
  position: relative;
  padding-left: 40px;
}

.log-timeline::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, #00d4ff, #00ff99);
}

.log-item {
  position: relative;
  margin-bottom: 30px;
  padding: 20px;
  background: var(--bg-card);
  border-radius: 12px;
  border-left: 3px solid #00d4ff;
  transition: all 0.3s ease;
}

.log-item:hover {
  background: var(--bg-secondary);
  transform: translateX(5px);
}

.log-item::before {
  content: '';
  position: absolute;
  left: -43px;
  top: 25px;
  width: 14px;
  height: 14px;
  background: #ffaa00;
  border-radius: 50%;
  border: 3px solid #091020;
}

.log-item.resolved {
  border-left-color: #00ff99;
}

.log-item.resolved::before {
  background: #00ff99;
}

.log-date {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-bottom: 8px;
}

.log-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.log-description {
  opacity: 0.8;
  line-height: 1.6;
  margin-bottom: 10px;
}

.log-meta {
  display: flex;
  gap: 20px;
  font-size: 0.85rem;
  opacity: 0.7;
  flex-wrap: wrap;
}

.log-badge {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
}

.badge-open {
  background: rgba(255, 170, 0, 0.2);
  color: #ffaa00;
}

.badge-resolved {
  background: rgba(0, 255, 153, 0.2);
  color: #00ff99;
}

.resolve-btn {
  margin-top: 10px;
  padding: 8px 18px;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  border: none;
  border-radius: 8px;
  color: #111;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.resolve-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0, 212, 255, 0.35);
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  animation: fadeIn 0.3s ease;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: var(--bg-card);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 40px;
  max-width: 500px;
  width: 90%;
  animation: slideUp 0.3s ease;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.modal-header h2 {
  font-size: 1.8rem;
}

.close-modal {
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 2rem;
  cursor: pointer;
  padding: 0;
  width: 40px;
  height: 40px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 18px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 1rem;
}

.form-group select option { color: #111; background: #fff; }

.form-group textarea {
  resize: vertical;
  min-height: 90px;
}

.modal-actions {
  display: flex;
  gap: 15px;
  justify-content: flex-end;
  margin-top: 30px;
}

.btn-secondary {
  padding: 12px 24px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-secondary:hover {
  background: var(--border-color);
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }

  .page-header {
    flex-direction: column;
    gap: 20px;
  }

  .report-btn {
    width: 100%;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:var(--bg-card);backdrop-filter:blur(20px);border-right:1px solid var(--border-color);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:var(--bg-secondary);color:var(--text-primary);}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:var(--accent-primary);font-weight:500;border-left:3px solid var(--accent-primary);}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:var(--bg-secondary);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="maintenance-container">
  <div class="page-header">
    <h1>🔧 Maintenance Logs</h1>
    <button class="report-btn" onclick="reportIssue()">+ Report Issue</button>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="stats-overview">
    <div class="stat-card">
      <h3>Open Issues</h3>
      <div class="stat-value" id="statOpen" style="color:var(--warning);">…</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">Awaiting action</p>
    </div>
    <div class="stat-card">
      <h3>Resolved</h3>
      <div class="stat-value" id="statResolved">…</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">Completed</p>
    </div>
    <div class="stat-card">
      <h3>Total Logged</h3>
      <div class="stat-value" id="statTotal" style="color:var(--accent-primary);">…</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">All issues</p>
    </div>
    <div class="stat-card">
      <h3>Critical Bins</h3>
      <div class="stat-value" id="statCritical" style="color:var(--danger);">…</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">At or above 80%</p>
    </div>
  </div>

  <div class="maintenance-log">
    <div class="log-header">
      <h2>Issue Timeline</h2>
      <div class="filter-tabs">
        <div class="tab active" data-filter="all" onclick="setFilter('all')">All</div>
        <div class="tab" data-filter="open" onclick="setFilter('open')">Open</div>
        <div class="tab" data-filter="resolved" onclick="setFilter('resolved')">Resolved</div>
      </div>
    </div>

    <div class="log-timeline" id="timeline">
      <div style="text-align: center; padding: 30px; opacity: 0.6;">Loading maintenance log…</div>
    </div>
  </div>
</div>

<!-- Report Issue Modal -->
<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Report an Issue</h2>
      <button class="close-modal" onclick="closeReportModal()">×</button>
    </div>

    <form id="reportForm">
      <div class="form-group">
        <label>Bin</label>
        <select id="issueBin" class="styled-select">
          <option value="wetBin">💧 Wet Bin</option>
          <option value="dryBin">♻️ Dry Bin</option>
          <option value="">System-wide</option>
        </select>
      </div>

      <div class="form-group">
        <label>Issue Type</label>
        <select id="issueType" class="styled-select">
          <option value="sensor">📡 Sensor fault</option>
          <option value="overflow">🗑️ Overflows before collection</option>
          <option value="blocked">🚧 Inlet blocked</option>
          <option value="power">🔋 Power failure</option>
          <option value="damage">💥 Physical damage</option>
          <option value="other">❓ Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="issueDescription" placeholder="What seems to be wrong?" required></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeReportModal()">Cancel</button>
        <button type="submit" class="report-btn">Report Issue</button>
      </div>
    </form>
  </div>
</div>

<script>
var ISSUE_LABELS = { sensor: '📡 Sensor', overflow: '🗑️ Overflow', blocked: '🚧 Blocked',
                     power: '🔋 Power', damage: '💥 Damage', other: '❓ Other' };
var BIN_LABELS = { wetBin: '💧 Wet Bin', dryBin: '♻️ Dry Bin', '': 'System-wide' };
var currentFilter = 'all';
var logs = [];

window.flash = function(msg, isErr) {
  var el = document.getElementById('statusLine');
  if (!el) return;
  el.className = 'status-line ' + (isErr ? 'err' : 'ok');
  el.textContent = msg;
  clearTimeout(window._flashTimer);
  window._flashTimer = setTimeout(function() { el.className = 'status-line'; }, 4000);
};

window.esc = function(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

window.fmtWhen = function(ts) {
  var d = new Date((ts || '').replace(' ', 'T'));
  if (isNaN(d)) return (ts || '');
  var sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return 'Just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  if (sec < 604800) return Math.floor(sec / 86400) + 'd ago';
  return d.toLocaleDateString();
};

window.logRow = function(log) {
  var resolved = log.status === 'resolved';
  var item = document.createElement('div');
  item.className = 'log-item' + (resolved ? ' resolved' : '');
  item.dataset.filter = resolved ? 'resolved' : 'open';
  item.innerHTML =
    '<div class="log-date">' + fmtWhen(log.reported_at) + ' · ' + esc(log.reported_at) + '</div>' +
    '<div class="log-title">' + esc(ISSUE_LABELS[log.issue_type] || log.issue_type || 'Issue') +
      ' <span class="log-badge ' + (resolved ? 'badge-resolved' : 'badge-open') + '">' +
      (resolved ? 'RESOLVED' : 'OPEN') + '</span></div>' +
    '<div class="log-description">' + esc(log.description || '') + '</div>' +
    '<div class="log-meta">' +
      '<span>' + esc(BIN_LABELS[log.bin_id] || 'Unknown bin') + '</span>' +
      (resolved && log.resolved_at ? '<span>✅ Resolved ' + esc(log.resolved_at) + '</span>' : '') +
    '</div>' +
    (resolved ? '' : '<button class="resolve-btn" onclick="resolveIssue(' + log.id + ')">✔ Mark Resolved</button>');
  return item;
};

window.renderTimeline = function() {
  var tl = document.getElementById('timeline');
  if (!logs.length) {
    tl.innerHTML =
      '<div style="text-align:center;padding:30px;opacity:0.7;">' +
        '<div style="font-size:3rem;margin-bottom:12px;">🧰</div>' +
        '<p>No maintenance issues logged yet. Report one to track it here.</p>' +
      '</div>';
    return;
  }
  tl.innerHTML = '';
  logs.forEach(function(log) {
    var row = logRow(log);
    if (currentFilter === 'all' || row.dataset.filter === currentFilter) tl.appendChild(row);
  });
};

window.setFilter = function(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t) {
    if (t.getAttribute('data-filter') === filter) t.classList.add('active');
  });
  renderTimeline();
};

window.loadMaintenance = function() {
  fetch('/api/maintenance', { credentials: 'include' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data) throw new Error('maintenance endpoint unavailable');
      logs = data.logs || [];
      var s = data.stats || {};
      var set = function(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; };
      set('statOpen', s.open != null ? s.open : 0);
      set('statResolved', s.resolved != null ? s.resolved : 0);
      set('statTotal', s.total != null ? s.total : 0);
      renderTimeline();
    })
    .catch(function() {
      document.getElementById('timeline').innerHTML =
        '<div style="text-align:center;padding:30px;color:var(--danger);">Failed to load maintenance log.</div>';
    });

  fetch('/api/bins')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !data.bins) return;
      var critical = Object.keys(data.bins).filter(function(k) { return (data.bins[k].level || 0) >= 80; }).length;
      var el = document.getElementById('statCritical'); if (el) el.textContent = critical;
    })
    .catch(function() {});
};

window.reportIssue = function() {
  document.getElementById('reportModal').classList.add('show');
};

window.closeReportModal = function() {
  document.getElementById('reportModal').classList.remove('show');
};

window.resolveIssue = function(id) {
  fetch('/api/maintenance/' + id + '/resolve', { method: 'POST', credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.status === 'ok') { flash('Issue marked as resolved.'); loadMaintenance(); }
      else flash(res.error || 'Failed to resolve issue.', true);
    })
    .catch(function() { flash('Failed to resolve issue.', true); });
};

(function init() {
  document.getElementById('reportForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var payload = {
      binId: document.getElementById('issueBin').value,
      issueType: document.getElementById('issueType').value,
      description: document.getElementById('issueDescription').value.trim()
    };
    fetch('/api/maintenance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.error) { flash(res.error, true); return; }
        flash('Issue reported.');
        closeReportModal();
        document.getElementById('issueDescription').value = '';
        loadMaintenance();
      })
      .catch(function() { flash('Failed to report issue.', true); });
  });

  loadMaintenance();
  setInterval(loadMaintenance, 30000);
})();
</script>

<script type="module" src="/frontend/shared/js/theme-switcher.js"></script>
</body>
</html>
