<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/images/favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/images/favicon-16x16.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo.png?v=1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo-dark.png?v=1" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/frontend/assets/images/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/apple-touch-icon.png?v=1">
<meta name="theme-color" content="#091020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">
<link rel="stylesheet" href="/frontend/shared/css/animations.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.leaderboard-container {
  max-width: 900px;
  margin: 0 auto;
}

.page-header {
  text-align: center;
  margin-bottom: 50px;
}

.page-header h1 {
  font-size: 3rem;
  margin-bottom: 10px;
}

.page-header p {
  font-size: 1.1rem;
  opacity: 0.8;
}

.filter-tabs {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.tab {
  padding: 12px 30px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab:hover,
.tab.active {
  background: rgba(0, 212, 255, 0.2);
  border-color: #00d4ff;
  transform: translateY(-2px);
}

.podium {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 40px;
  align-items: end;
}

.podium-item {
  text-align: center;
  position: relative;
}

.podium-item.first {
  order: 2;
}

.podium-item.second {
  order: 1;
}

.podium-item.third {
  order: 3;
}

.podium-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  font-weight: bold;
  color: #111;
  margin: 0 auto 15px;
  position: relative;
  box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
}

.podium-item.first .podium-avatar {
  width: 120px;
  height: 120px;
  font-size: 3rem;
}

.crown {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 2rem;
  animation: bounce 2s infinite;
}

.podium-rank {
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 10px;
}

.podium-item.first .podium-rank {
  color: #FFD700;
}

.podium-item.second .podium-rank {
  color: #C0C0C0;
}

.podium-item.third .podium-rank {
  color: #CD7F32;
}

body.theme-light .podium-item.first .podium-rank {
  color: #a88400;
}

body.theme-light .podium-item.second .podium-rank {
  color: #6a7480;
}

body.theme-light .podium-item.third .podium-rank {
  color: #9a5d1e;
}

.podium-name {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 5px;
}

.podium-points {
  font-size: 1.5rem;
  color: var(--success);
  font-weight: 700;
}

.leaderboard-list {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 30px;
}

.leaderboard-list h2 {
  margin-bottom: 25px;
  font-size: 1.5rem;
}

.rank-item {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px;
  background: var(--bg-card);
  border-radius: 12px;
  margin-bottom: 12px;
  transition: all 0.3s ease;
}

.rank-item:hover {
  background: var(--bg-secondary);
  transform: translateX(5px);
}

.rank-item.current-user {
  background: rgba(0, 212, 255, 0.15);
  border: 2px solid #00d4ff;
}

.rank-number {
  font-size: 1.5rem;
  font-weight: bold;
  width: 50px;
  text-align: center;
  color: var(--accent-primary);
}

.rank-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  font-weight: bold;
  color: #111;
  flex-shrink: 0;
}

.rank-info {
  flex: 1;
}

.rank-name {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 3px;
}

.rank-stats {
  font-size: 0.85rem;
  opacity: 0.7;
}

.rank-points {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--success);
}

.your-rank {
  background: rgba(0, 212, 255, 0.1);
  border: 2px solid #00d4ff;
  border-radius: 15px;
  padding: 25px;
  margin-top: 30px;
  text-align: center;
}

.your-rank h3 {
  margin-bottom: 15px;
}

.your-rank .rank-number {
  font-size: 3rem;
  color: var(--accent-primary);
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }
  
  .podium {
    grid-template-columns: 1fr;
  }
  
  .podium-item {
    order: initial !important;
  }
  
  .page-header h1 {
    font-size: 2rem;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:var(--bg-card);backdrop-filter:blur(20px);border-right:1px solid var(--border-color);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:var(--bg-secondary);color:var(--text-primary);}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:var(--accent-primary);font-weight:500;border-left:3px solid var(--accent-primary);}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:var(--bg-secondary);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="leaderboard-container">
  <div class="page-header slide-up">
    <h1>🏆 Leaderboard</h1>
    <p>Top eco-warriors making a difference</p>
  </div>

  <div class="filter-tabs">
    <div class="tab active" onclick="filterLeaderboard('all')">🌍 All Time</div>
    <div class="tab" onclick="filterLeaderboard('weekly')">📅 This Week</div>
    <div class="tab" onclick="filterLeaderboard('monthly')">📆 This Month</div>
  </div>

  <div class="podium fade-in-stagger">
    <div class="podium-item first">
      <div class="crown">👑</div>
      <div class="podium-avatar" id="first-avatar">A</div>
      <div class="podium-rank">🥇 1st</div>
      <div class="podium-name" id="first-name">Loading...</div>
      <div class="podium-points" id="first-points">0 pts</div>
    </div>

    <div class="podium-item second">
      <div class="podium-avatar" id="second-avatar">B</div>
      <div class="podium-rank">🥈 2nd</div>
      <div class="podium-name" id="second-name">Loading...</div>
      <div class="podium-points" id="second-points">0 pts</div>
    </div>

    <div class="podium-item third">
      <div class="podium-avatar" id="third-avatar">C</div>
      <div class="podium-rank">🥉 3rd</div>
      <div class="podium-name" id="third-name">Loading...</div>
      <div class="podium-points" id="third-points">0 pts</div>
    </div>
  </div>

  <div class="leaderboard-list slide-up delay-3">
    <h2 id="rankingsTitle">Full Rankings · All Time</h2>
    <div id="rankingsList">
      <div style="text-align: center; padding: 40px; opacity: 0.6;">
        <div style="font-size: 3rem;">⏳</div>
        <p>Loading rankings...</p>
      </div>
    </div>
  </div>

  <div class="your-rank slide-up delay-4" id="yourRank" style="display: none;">
    <h3>Your Position</h3>
    <div class="rank-number" id="userPosition">#-</div>
    <p style="opacity: 0.8;">Keep going! You're doing great!</p>
  </div>
</div>

<script>
let currentFilter = 'all';
let currentUserId = null;

function getDisplayName(user) {
  return user.full_name || user.username || 'Anonymous';
}

function avatarHtml(user) {
  var initial = getDisplayName(user).charAt(0);
  if (user && user.avatar_url) {
    return '<img src="' + user.avatar_url + '" alt="' + initial + '" ' +
      'style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">';
  }
  return initial;
}

async function getLeaderboard(limit) {
  const res = await fetch('/api/gamification/leaderboard?limit=' + (limit || 50) + '&period=' + encodeURIComponent(currentFilter));
  if (!res.ok) throw new Error('Failed to load leaderboard');
  return await res.json();
}

async function loadCurrentUser() {
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated && data.user) currentUserId = data.user.id;
    }
  } catch (e) {}
}

async function loadLeaderboard() {
  try {
    const rankings = await getLeaderboard(50);
    
    if (rankings.length === 0) {
      document.getElementById('rankingsList').innerHTML = `
        <div style="text-align: center; padding: 40px; opacity: 0.6;">
          <div style="font-size: 3rem;">📊</div>
          <p>No rankings yet. Be the first!</p>
        </div>
      `;
      return;
    }
    
    // Update podium
    if (rankings[0]) {
      document.getElementById('first-avatar').innerHTML = avatarHtml(rankings[0]);
      document.getElementById('first-name').textContent = getDisplayName(rankings[0]);
      document.getElementById('first-points').textContent = rankings[0].eco_score + ' pts';
    }
    
    if (rankings[1]) {
      document.getElementById('second-avatar').innerHTML = avatarHtml(rankings[1]);
      document.getElementById('second-name').textContent = getDisplayName(rankings[1]);
      document.getElementById('second-points').textContent = rankings[1].eco_score + ' pts';
    }
    
    if (rankings[2]) {
      document.getElementById('third-avatar').innerHTML = avatarHtml(rankings[2]);
      document.getElementById('third-name').textContent = getDisplayName(rankings[2]);
      document.getElementById('third-points').textContent = rankings[2].eco_score + ' pts';
    }
    
    // Update full list (4th place onwards)
    const listHTML = rankings.slice(3).map((user, index) => {
      const rank = index + 4;
      const isCurrentUser = currentUserId !== null && user.id === currentUserId;
      const icons = Array.isArray(user.badgeIcons) ? user.badgeIcons.slice(0, 4).join(' ') : '';

      return `
        <div class="rank-item ${isCurrentUser ? 'current-user' : ''}">
          <div class="rank-number">#${rank}</div>
          <div class="rank-avatar">${avatarHtml(user)}</div>
          <div class="rank-info">
            <div class="rank-name">${getDisplayName(user)} ${isCurrentUser ? '(You)' : ''}</div>
            <div class="rank-stats">
              ${icons ? icons + ' · ' : ''}🏆 ${user.badges || 0} badges · 🔥 ${user.streak_days || 0} day streak
            </div>
          </div>
          <div class="rank-points">${user.eco_score}</div>
        </div>
      `;
    }).join('');
    
    document.getElementById('rankingsList').innerHTML = listHTML || '<p style="text-align: center; opacity: 0.6;">No more rankings</p>';
    
    // Show user's position
    if (currentUserId !== null) {
      const userRank = rankings.findIndex(u => u.id === currentUserId) + 1;
      if (userRank > 0) {
        document.getElementById('yourRank').style.display = 'block';
        document.getElementById('userPosition').textContent = '#' + userRank;
      }
    }
    
  } catch (error) {
    console.error('Error loading leaderboard:', error);
    document.getElementById('rankingsList').innerHTML = `
      <div style="text-align: center; padding: 40px; color: var(--danger);">
        <div style="font-size: 3rem;">⚠️</div>
        <p>Error loading rankings. Please try again.</p>
      </div>
    `;
  }
}

window.filterLeaderboard = function(filter) {
  currentFilter = filter;
  
  // Update active tab
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  event.target.classList.add('active');

  // Reflect the selected period in the list header
  const titles = { all: 'All Time', weekly: 'This Week', monthly: 'This Month' };
  const titleEl = document.getElementById('rankingsTitle');
  if (titleEl) titleEl.textContent = 'Full Rankings · ' + (titles[filter] || 'All Time');

  // Reload leaderboard for the selected period
  loadLeaderboard();
};

loadCurrentUser();
loadLeaderboard();
setInterval(loadLeaderboard, 60000); // Refresh every minute
</script>

<script type="module" src="/frontend/shared/js/theme-switcher.js"></script>
</body>
</html>
