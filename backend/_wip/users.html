<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #091020, #020617);
  color: white;
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.users-container {
  max-width: 1400px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  flex-wrap: wrap;
  gap: 20px;
}

.page-header h1 {
  font-size: 2.5rem;
}

.header-actions {
  display: flex;
  gap: 15px;
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary {
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  color: #111;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.users-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: #00d4ff;
  margin: 10px 0;
}

.filters-search {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
}

.search-box {
  flex: 1;
  min-width: 250px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 18px 12px 45px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  color: white;
  font-size: 1rem;
}

.search-box::before {
  content: '🔍';
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
}

.filter-select {
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

.users-table {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  overflow: hidden;
}

.table-header {
  background: rgba(0, 212, 255, 0.1);
  padding: 20px;
  display: grid;
  grid-template-columns: 50px 60px 2fr 1.5fr 1fr 1fr 1fr 120px;
  gap: 15px;
  font-weight: 600;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.user-row {
  padding: 20px;
  display: grid;
  grid-template-columns: 50px 60px 2fr 1.5fr 1fr 1fr 1fr 120px;
  gap: 15px;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
}

.user-row:hover {
  background: rgba(255, 255, 255, 0.05);
}

.user-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 1.2rem;
  color: #111;
}

.user-name {
  font-weight: 600;
}

.user-email {
  opacity: 0.7;
  font-size: 0.9rem;
}

.user-badge {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
}

.badge-admin { background: rgba(255, 0, 100, 0.2); color: #ff6b9d; }
.badge-supervisor { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
.badge-cleaner { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
.badge-resident { background: rgba(0, 255, 153, 0.2); color: #00ff99; }

.user-status {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
}

.status-active { background: rgba(0, 255, 153, 0.2); color: #00ff99; }
.status-inactive { background: rgba(255, 68, 68, 0.2); color: #ff6b6b; }

.action-buttons {
  display: flex;
  gap: 8px;
}

.action-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.btn-edit {
  background: rgba(0, 212, 255, 0.2);
  color: #00d4ff;
}

.btn-delete {
  background: rgba(255, 68, 68, 0.2);
  color: #ff6b6b;
}

.action-btn:hover {
  transform: scale(1.1);
}

.pagination {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 30px;
}

.page-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
}

.page-btn:hover,
.page-btn.active {
  background: rgba(0, 212, 255, 0.2);
  border-color: #00d4ff;
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 40px;
  max-width: 500px;
  width: 90%;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 30px;
}

.close-modal {
  background: none;
  border: none;
  color: white;
  font-size: 2rem;
  cursor: pointer;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  color: white;
  font-size: 1rem;
}

@media (max-width: 1200px) {
  .table-header,
  .user-row {
    grid-template-columns: 50px 1fr 1fr 100px;
  }
  
  .user-row > *:nth-child(3),
  .user-row > *:nth-child(5),
  .user-row > *:nth-child(6),
  .table-header > *:nth-child(3),
  .table-header > *:nth-child(5),
  .table-header > *:nth-child(6) {
    display: none;
  }
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }
  
  .users-stats {
    grid-template-columns: 1fr 1fr;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:rgba(12,16,30,0.97);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.06);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:rgba(255,255,255,0.6);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:rgba(255,255,255,0.05);color:#fff;}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:#00d4ff;font-weight:500;border-left:3px solid #00d4ff;}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:rgba(255,255,255,0.12);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="users-container">
  <div class="page-header">
    <h1>👥 User Management</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="exportUsers()">📥 Export</button>
      <button class="btn btn-primary" onclick="openAddUserModal()">+ Add User</button>
    </div>
  </div>

  <div class="users-stats">
    <div class="stat-card">
      <h3>Total Users</h3>
      <div class="stat-value" id="totalUsers">0</div>
    </div>
    <div class="stat-card">
      <h3>Active</h3>
      <div class="stat-value" style="color: #00ff99;" id="activeUsers">0</div>
    </div>
    <div class="stat-card">
      <h3>Admins</h3>
      <div class="stat-value" style="color: #ff6b9d;" id="adminCount">0</div>
    </div>
    <div class="stat-card">
      <h3>New This Month</h3>
      <div class="stat-value" style="color: #ffaa00;" id="newUsers">0</div>
    </div>
  </div>

  <div class="filters-search">
    <div class="search-box">
      <input type="text" id="searchUsers" placeholder="Search users..." onkeyup="filterUsers()">
    </div>
    <select class="filter-select" id="roleFilter" onchange="filterUsers()">
      <option value="all">All Roles</option>
      <option value="admin">Admin</option>
      <option value="supervisor">Supervisor</option>
      <option value="cleaner">Cleaner</option>
      <option value="resident">Resident</option>
    </select>
    <select class="filter-select" id="statusFilter" onchange="filterUsers()">
      <option value="all">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

  <div class="users-table">
    <div class="table-header">
      <div>#</div>
      <div>Avatar</div>
      <div>Name</div>
      <div>Email</div>
      <div>Role</div>
      <div>Points</div>
      <div>Status</div>
      <div>Actions</div>
    </div>

    <div id="usersList">
    </div>
  </div>

  <div class="pagination">
    <button class="page-btn">«</button>
    <button class="page-btn active">1</button>
    <button class="page-btn">2</button>
    <button class="page-btn">3</button>
    <button class="page-btn">»</button>
  </div>
</div>


<!-- Add/Edit User Modal -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Add New User</h2>
      <button class="close-modal" onclick="closeModal()">×</button>
    </div>
    
    <form id="userForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="userName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="userEmail" required>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="userRole">
          <option value="resident">Resident</option>
          <option value="cleaner">Cleaner</option>
          <option value="supervisor">Supervisor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="userPassword" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Save User</button>
    </form>
  </div>
</div>

<script>
// User management backed by the live /api endpoints
var users = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmt(ts) {
  if (!ts) return 'New';
  var d = new Date(ts.replace(' ', 'T'));
  if (isNaN(d)) return 'New';
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  return days <= 30 ? 'Active' : 'Inactive';
}

function roleBadge(role) {
  var r = role || 'user';
  var cls = 'badge-resident';
  if (r === 'admin') cls = 'badge-admin';
  if (r === 'supervisor') cls = 'badge-supervisor';
  if (r === 'cleaner') cls = 'badge-cleaner';
  return '<span class="user-badge ' + cls + '">' + r.charAt(0).toUpperCase() + r.slice(1) + '</span>';
}

function renderUsers(list) {
  var container = document.getElementById('usersList');
  container.innerHTML = '';
  if (!list.length) {
    container.innerHTML = '<div style="text-align:center;padding:24px;opacity:0.6;">No users found.</div>';
    return;
  }
  list.forEach(function(u, idx) {
    var initials = (u.full_name || u.username || '?').charAt(0).toUpperCase();
    var isActive = fmt(u.last_login) === 'Active';
    var row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML =
      '<div>' + (idx + 1) + '</div>' +
      '<div class="user-avatar">' + esc(initials) + '</div>' +
      '<div><div class="user-name">' + esc(u.full_name || u.username) + '</div><div class="user-email">' + esc(u.email || '') + '</div></div>' +
      '<div>' + esc(u.email || '') + '</div>' +
      '<div>' + roleBadge(u.role) + '</div>' +
      '<div>' + (u.eco_score != null ? u.eco_score : 0) + '</div>' +
      '<div><span class="user-status ' + (isActive ? 'status-active' : 'status-inactive') + '">' + fmt(u.last_login) + '</span></div>' +
      '<div class="action-buttons" style="flex-wrap:wrap;">' +
        '<select style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:4px 6px;font-size:0.75rem;" onchange="changeRole(' + u.id + ', this.value)">' +
          '<option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option>' +
          '<option value="supervisor"' + (u.role === 'supervisor' ? ' selected' : '') + '>Supervisor</option>' +
          '<option value="cleaner"' + (u.role === 'cleaner' ? ' selected' : '') + '>Cleaner</option>' +
          '<option value="resident"' + (u.role === 'resident' ? ' selected' : '') + '>Resident</option>' +
          '<option value="user"' + (u.role === 'user' ? ' selected' : '') + '>User</option>' +
        '</select>' +
        '<button class="action-btn btn-delete" title="Delete" onclick="deleteUser(' + u.id + ')">🗑️</button>' +
      '</div>';
    container.appendChild(row);
  });
}

function loadUsers() {
  fetch('/api/admin/users', { credentials: 'same-origin' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data) { renderUsers([]); return; }
      users = data;
      var active = data.filter(function(u) { return fmt(u.last_login) === 'Active'; }).length;
      var admins = data.filter(function(u) { return u.role === 'admin'; }).length;
      var recent = data.filter(function(u) { return fmt(u.created_at) === 'Active'; }).length;
      document.getElementById('totalUsers').textContent = data.length;
      document.getElementById('activeUsers').textContent = active;
      document.getElementById('adminCount').textContent = admins;
      document.getElementById('newUsers').textContent = recent;
      filterUsers();
    })
    .catch(function(e) { console.error('Users load error:', e); });
}

function changeRole(userId, role) {
  fetch('/api/admin/users/' + userId + '/role', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ role: role })
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      alert(res.status === 'ok' ? 'Role updated.' : (res.error || 'Failed to update role.'));
      if (res.status === 'ok') loadUsers();
    })
    .catch(function() { alert('Failed to update role.'); });
}

function deleteUser(userId) {
  if (!confirm('Delete this user and all their data? This cannot be undone.')) return;
  fetch('/api/admin/users/' + userId, {
    method: 'DELETE',
    credentials: 'same-origin'
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      alert(res.status === 'ok' ? 'User deleted.' : (res.error || 'Failed to delete user.'));
      if (res.status === 'ok') loadUsers();
    })
    .catch(function() { alert('Failed to delete user.'); });
}

function filterUsers() {
  var search = document.getElementById('searchUsers').value.toLowerCase();
  var roleFilter = document.getElementById('roleFilter').value;
  var statusFilter = document.getElementById('statusFilter').value;
  var filtered = users.filter(function(u) {
    var matchSearch = (u.full_name || '').toLowerCase().includes(search) ||
                      (u.username || '').toLowerCase().includes(search) ||
                      (u.email || '').toLowerCase().includes(search);
    var matchRole = roleFilter === 'all' || (u.role || 'user') === roleFilter;
    var active = fmt(u.last_login) === 'Active';
    var matchStatus = statusFilter === 'all' || (statusFilter === 'active' ? active : !active);
    return matchSearch && matchRole && matchStatus;
  });
  renderUsers(filtered);
}

function openAddUserModal() {
  document.getElementById('userModal').classList.add('show');
}

function closeModal() {
  document.getElementById('userModal').classList.remove('show');
}

document.getElementById('userForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var role = document.getElementById('userRole').value;
  var payload = {
    username: document.getElementById('userName').value.trim(),
    email: document.getElementById('userEmail').value.trim(),
    fullName: document.getElementById('userName').value.trim(),
    password: document.getElementById('userPassword').value
  };
  fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(payload)
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.userId) {
        if (role !== 'user' && role !== 'resident') {
          return fetch('/api/admin/users/' + res.userId + '/role', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ role: role })
          }).then(function() { return res; });
        }
        return res;
      }
      throw new Error(res.error || 'Failed to create user.');
    })
    .then(function() {
      alert('User created.');
      closeModal();
      loadUsers();
    })
    .catch(function(err) { alert(err.message || 'Failed to create user.'); });
});

function exportUsers() {
  var rows = [['ID','Username','Email','Full Name','Role','Eco Score','Streak Days','Created At','Last Login']];
  users.forEach(function(u) {
    rows.push([u.id, u.username, u.email, u.full_name, u.role, u.eco_score, u.streak_days, u.created_at, u.last_login]);
  });
  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'users.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

loadUsers();
</script>

</body>
</html>
