<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/images/favicon-32x32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/images/favicon-16x16.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo.png?v=1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="/frontend/assets/images/logo-dark.png?v=1" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/frontend/assets/images/favicon.ico?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/apple-touch-icon.png?v=1">
<meta name="theme-color" content="#091020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locations - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">
<link rel="stylesheet" href="/frontend/shared/css/animations.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.locations-container {
  max-width: 1200px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 20px;
}

.page-header h1 {
  font-size: 2.5rem;
}

.add-location-btn {
  padding: 14px 30px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border: none;
  border-radius: 12px;
  color: #111;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.add-location-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
}

.status-line {
  border-radius: 12px;
  padding: 14px 20px;
  margin-bottom: 20px;
  font-size: 0.95rem;
  display: none;
}

.status-line.ok { display: block; background: color-mix(in srgb, var(--success) 12%, transparent); border: 1px solid color-mix(in srgb, var(--success) 40%, transparent); color: var(--success); }
.status-line.err { display: block; background: color-mix(in srgb, var(--danger) 12%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); }

.loader {
  text-align: center;
  padding: 60px;
  opacity: 0.6;
  font-size: 0.95rem;
}

.locations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 25px;
  margin-bottom: 40px;
}

/* Content area below the header: fills remainder of the viewport so the
   empty state can center vertically. */
.list-area {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 260px);
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 6px;
  padding: 40px 20px;
  opacity: 0.75;
}

.empty-state .empty-icon {
  font-size: 3.5rem;
}

.empty-state h3 {
  color: var(--accent-primary);
  font-size: 1.4rem;
  margin: 6px 0 2px;
}

.empty-state p {
  max-width: 420px;
  margin: 0 auto;
  font-size: 0.95rem;
}

.location-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 30px;
  transition: all 0.3s ease;
  position: relative;
}

.location-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0, 212, 255, 0.3);
}

.location-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 20px;
}

.location-icon {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
}

.location-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  width: 35px;
  height: 35px;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.action-btn:hover {
  background: color-mix(in srgb, var(--text-primary) 10%, transparent);
  transform: scale(1.1);
}

.location-name {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 5px;
}

.location-address {
  opacity: 0.7;
  font-size: 0.9rem;
  margin-bottom: 20px;
}

.bins-status {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.bin-status {
  background: var(--bg-card);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

.bin-status .icon {
  font-size: 1.5rem;
  margin-bottom: 8px;
}

.bin-status .level {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--success);
}

.bin-status .label {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 5px;
}

.location-stats {
  display: flex;
  justify-content: space-between;
  padding-top: 15px;
  border-top: 1px solid var(--border-color);
  font-size: 0.9rem;
}

.stat-item {
  text-align: center;
}

.stat-item .value {
  font-weight: 700;
  color: var(--accent-primary);
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  animation: fadeIn 0.3s ease;
}

.modal.show {
  display: flex;
}

.modal-content {
  background: var(--bg-card);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 40px;
  max-width: 520px;
  width: 90%;
  animation: slideUp 0.3s ease;
  max-height: 92vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.modal-header h2 {
  font-size: 1.8rem;
}

.close-modal {
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 2rem;
  cursor: pointer;
  padding: 0;
  width: 40px;
  height: 40px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 18px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 1rem;
}

.form-group select option { color: #111; background: #fff; }

.form-group textarea {
  resize: vertical;
  min-height: 80px;
}

.modal-actions {
  display: flex;
  gap: 15px;
  justify-content: flex-end;
  margin-top: 30px;
}

.btn-secondary {
  padding: 12px 24px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-secondary:hover {
  background: color-mix(in srgb, var(--text-primary) 10%, transparent);
}

/* "Use Current Location" geolocation helper */
.geo-wrapper {
  margin-bottom: 20px;
}

.geo-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  background: var(--bg-secondary);
  border: 1px dashed var(--border-color);
  border-radius: 12px;
  color: var(--accent-primary);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.geo-btn:hover {
  background: color-mix(in srgb, var(--accent-primary) 10%, transparent);
  border-color: var(--accent-primary);
}

.geo-btn:disabled {
  opacity: 0.75;
  cursor: wait;
}

.geo-btn-icon {
  display: inline-block;
  width: 18px;
  text-align: center;
  font-size: 1rem;
}

.geo-btn.loading .geo-btn-icon {
  width: 14px;
  height: 14px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: geoSpin 0.7s linear infinite;
  font-size: 0;
}

@keyframes geoSpin {
  to { transform: rotate(360deg); }
}

.geo-status {
  font-size: 0.85rem;
  margin-top: 8px;
  color: var(--text-secondary);
  line-height: 1.45;
}

.geo-status.ok { color: var(--success); }
.geo-status.warn { color: var(--warning); }

.geo-retry {
  color: var(--accent-primary);
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }

  .page-header {
    flex-direction: column;
    gap: 20px;
  }

  .add-location-btn {
    width: 100%;
  }

  .locations-grid,
  .form-row {
    grid-template-columns: 1fr;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:var(--bg-card);backdrop-filter:blur(20px);border-right:1px solid var(--border-color);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--text-secondary);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:var(--bg-secondary);color:var(--text-primary);}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:var(--accent-primary);font-weight:500;border-left:3px solid var(--accent-primary);}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:var(--bg-secondary);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="locations-container">
  <div class="page-header slide-up">
    <h1>📍 Bin Locations</h1>
    <button class="add-location-btn" onclick="openAddModal()">+ Add Location</button>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div class="list-area">
    <div class="empty-state fade-in-stagger" id="emptyState" style="display:none;">
      <div class="empty-icon">📍</div>
      <h3>No locations yet</h3>
      <p>Add your first bin location to manage it here and see it on the map.</p>
    </div>

    <div class="locations-grid fade-in-stagger" id="locationsGrid">
      <div class="loader">Loading locations…</div>
    </div>
  </div>
</div>

<!-- Add/Edit Location Modal -->
<div class="modal" id="addLocationModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="locationModalTitle">Add New Location</h2>
      <button class="close-modal" onclick="closeAddModal()">×</button>
    </div>

    <form id="addLocationForm">
      <div class="form-group">
        <label>Location Name</label>
        <input type="text" id="locationName" placeholder="e.g., Building A - Floor 3" required>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea id="locationAddress" placeholder="Full address of the location" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Icon</label>
          <select id="locationIcon" class="styled-select">
            <option value="🏢">🏢 Office Building</option>
            <option value="🏠">🏠 Residential</option>
            <option value="🏭">🏭 Industrial</option>
            <option value="🏫">🏫 School</option>
            <option value="🏥">🏥 Hospital</option>
            <option value="🍽️">🍽️ Restaurant</option>
            <option value="🏨">🏨 Hotel</option>
            <option value="🏪">🏪 Store</option>
          </select>
        </div>

        <div class="form-group">
          <label>Number of Bins</label>
          <input type="number" id="locationBins" min="1" max="20" value="2">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Latitude</label>
          <input type="number" step="any" id="locationLat" placeholder="e.g., 28.6139">
        </div>

        <div class="form-group">
          <label>Longitude</label>
          <input type="number" step="any" id="locationLng" placeholder="e.g., 77.2090">
        </div>
      </div>

      <div class="geo-wrapper">
        <button type="button" class="geo-btn" id="useLocationBtn" onclick="useCurrentLocation()">
          <span class="geo-btn-icon" id="geoBtnIcon">📍</span>
          <span id="geoBtnLabel">Use my current location</span>
        </button>
        <div class="geo-status" id="geoStatus"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button type="submit" class="add-location-btn" id="saveLocationBtn">Save Location</button>
      </div>
    </form>
  </div>
</div>

<script>
var locations = [];
var totalCollections = 0;
var liveWet = 0;
var liveDry = 0;

window.flash = function(msg, isErr) {
  var el = document.getElementById('statusLine');
  if (!el) return;
  el.className = 'status-line ' + (isErr ? 'err' : 'ok');
  el.textContent = msg;
  clearTimeout(window._flashTimer);
  window._flashTimer = setTimeout(function() { el.className = 'status-line'; }, 4000);
};

window.esc = function(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

window.openAddModal = function(id) {
  var title = document.getElementById('locationModalTitle');
  title.textContent = id != null ? 'Edit Location' : 'Add New Location';
  var loc = id != null ? (locations.find(function(x) { return x.id === id; }) || {}) : {};
  document.getElementById('locationName').value = loc.name || '';
  document.getElementById('locationAddress').value = loc.address || '';
  document.getElementById('locationIcon').value = loc.icon || '🏢';
  document.getElementById('locationBins').value = loc.bins || 2;
  document.getElementById('locationLat').value = loc.lat != null ? loc.lat : '';
  document.getElementById('locationLng').value = loc.lng != null ? loc.lng : '';
  document.getElementById('addLocationModal')._editId = (id != null ? id : null);
  var geoStatus = document.getElementById('geoStatus');
  if (geoStatus) { geoStatus.className = 'geo-status'; geoStatus.textContent = ''; }
  document.getElementById('addLocationModal').classList.add('show');
};

window.closeAddModal = function() {
  document.getElementById('addLocationModal').classList.remove('show');
  document.getElementById('addLocationModal')._editId = null;
};

window.useCurrentLocation = function() {
  var btn = document.getElementById('useLocationBtn');
  var icon = document.getElementById('geoBtnIcon');
  var label = document.getElementById('geoBtnLabel');
  var statusEl = document.getElementById('geoStatus');
  var hasNav = !!(navigator.geolocation && navigator.geolocation.getCurrentPosition);

  function setBtn(state, msg) {
    btn.disabled = (state === 'loading');
    btn.classList.toggle('loading', state === 'loading');
    if (state === 'loading') {
      icon.textContent = '';
      label.textContent = 'Getting location…';
    } else {
      icon.textContent = '📍';
      label.textContent = 'Use my current location';
    }
    statusEl.className = 'geo-status';
    statusEl.textContent = msg || '';
  }
  function show(css, msg) {
    statusEl.className = 'geo-status ' + css;
    statusEl.textContent = msg;
  }

  if (!hasNav) {
    show('warn', 'Geolocation isn\u2019t supported by this browser — coordinates are still editable below, so you can enter them manually.');
    return;
  }
  if (!window.isSecureContext) {
    show('warn', 'Location access requires HTTPS or localhost. This works on http://localhost:5000 during development; once you deploy or share the site (ngrok, Render, most real hosting all provide HTTPS automatically) it will work there too. Coordinates are still editable below for manual entry.');
    return;
  }

  setBtn('loading');
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = Number(pos.coords.latitude).toFixed(6);
    var lng = Number(pos.coords.longitude).toFixed(6);
    document.getElementById('locationLat').value = lat;
    document.getElementById('locationLng').value = lng;
    setBtn('idle');
    show('ok', 'Location filled: ' + lat + ', ' + lng + ' — you can fine-tune these fields if needed.');
  }, function(err) {
    setBtn('idle');
    if (err.code === 1) {
      show('warn', 'Location access was denied — you can still enter coordinates manually, or find them on Google Maps by right-clicking your location.');
    } else if (err.code === 3) {
      statusEl.className = 'geo-status warn';
      statusEl.innerHTML = 'Timed out while getting your location. <a href="#" class="geo-retry" onclick="useCurrentLocation();return false;">Retry</a> — or enter coordinates manually.';
    } else {
      statusEl.className = 'geo-status warn';
      statusEl.innerHTML = 'Couldn\u2019t get your location (position unavailable). <a href="#" class="geo-retry" onclick="useCurrentLocation();return false;">Retry</a> — or enter coordinates manually.';
    }
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
};

window.effectiveLevels = function() {
  return { wet: liveWet, dry: liveDry };
};

window.locationCard = function(loc) {
  var lv = effectiveLevels();
  var wet = Number(lv.wet);
  var dry = Number(lv.dry);
  var card = document.createElement('div');
  card.className = 'location-card slide-up';
  card.innerHTML =
    '<div class="location-header">' +
      '<div class="location-icon">' + esc(loc.icon || '🏢') + '</div>' +
      '<div class="location-actions">' +
        '<button class="action-btn" title="Edit" onclick="openAddModal(' + loc.id + ')">✏️</button>' +
        '<button class="action-btn" title="Delete" onclick="deleteLocation(' + loc.id + ')">🗑️</button>' +
      '</div>' +
    '</div>' +
    '<div class="location-name">' + esc(loc.name) + '</div>' +
    '<div class="location-address">' + esc(loc.address || '') + '</div>' +
    (loc.lat != null && loc.lng != null
      ? '<div class="location-address">📍 ' + loc.lat + ', ' + loc.lng + '</div>'
      : '') +
    '<div class="bins-status">' +
      '<div class="bin-status"><div class="icon">💧</div><div class="level">' + wet + '%</div><div class="label">Wet Waste</div></div>' +
      '<div class="bin-status"><div class="icon">♻️</div><div class="level">' + dry + '%</div><div class="label">Dry Waste</div></div>' +
    '</div>' +
    '<div class="location-stats">' +
      '<div class="stat-item"><div class="value">' + totalCollections + '</div><div>Collections</div></div>' +
      '<div class="stat-item"><div class="value">' + (loc.bins || 2) + '</div><div>Bins</div></div>' +
      '<div class="stat-item"><div class="value">Configured</div><div>Status</div></div>' +
    '</div>';
  return card;
};

window.renderLocations = function() {
  var grid = document.getElementById('locationsGrid');
  var empty = document.getElementById('emptyState');
  if (!locations.length) {
    empty.style.display = 'flex';
    grid.style.display = 'none';
    grid.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = '';
  grid.innerHTML = '';
  locations.forEach(function(loc) { grid.appendChild(locationCard(loc)); });
};

window.loadLocations = function() {
  fetch('/api/locations', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(list) {
      locations = list || [];
      renderLocations();
    })
    .catch(function() {
      var grid = document.getElementById('locationsGrid');
      var empty = document.getElementById('emptyState');
      if (empty) empty.style.display = 'none';
      grid.style.display = '';
      grid.innerHTML = '<div style="text-align:center;padding:60px;color:var(--danger);">Failed to load locations.</div>';
    });
};

window.fetchLiveLevels = function() {
  fetch('/api/bins')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !data.bins) return;
      var w = data.bins.wetBin || {}, d = data.bins.dryBin || {};
      liveWet = w.level != null ? w.level : liveWet;
      liveDry = d.level != null ? d.level : liveDry;
      renderLocations();
    })
    .catch(function(e) { console.error('Locations live levels error:', e); });

  fetch('/api/stats')
    .then(function(r) { return r.json(); })
    .then(function(s) {
      if (s && s.totalCollections != null) { totalCollections = s.totalCollections; renderLocations(); }
    })
    .catch(function() {});
};

window.editLocation = function(id) { openAddModal(id); };

window.deleteLocation = function(id) {
  if (!confirm('Delete this location?')) return;
  fetch('/api/locations/' + id, { method: 'DELETE', credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.status === 'ok') { flash('Location deleted.'); loadLocations(); }
      else flash(res.error || 'Failed to delete location.', true);
    })
    .catch(function() { flash('Failed to delete location.', true); });
};

(function init() {
  document.getElementById('addLocationForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var modal = document.getElementById('addLocationModal');
    var id = modal._editId;
    var name = document.getElementById('locationName').value.trim();
    var address = document.getElementById('locationAddress').value.trim();
    var payload = {
      name: name,
      address: address,
      icon: document.getElementById('locationIcon').value,
      bins: parseInt(document.getElementById('locationBins').value, 10) || 2,
      lat: document.getElementById('locationLat').value,
      lng: document.getElementById('locationLng').value
    };
    var url = id != null ? '/api/locations/' + id : '/api/locations';
    var method = id != null ? 'PUT' : 'POST';
    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.error) { flash(res.error, true); return; }
        flash(id != null ? 'Location updated.' : 'Location added.');
        closeAddModal();
        loadLocations();
      })
      .catch(function() { flash('Failed to save location.', true); });
  });

  loadLocations();
  fetchLiveLevels();
  setInterval(fetchLiveLevels, 30000);
})();
</script>

<script type="module" src="/frontend/shared/js/theme-switcher.js"></script>
</body>
</html>
