<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance - Smart Waste Segregator</title>
<link rel="stylesheet" href="/frontend/shared/css/themes.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #091020, #020617);
  color: white;
  min-height: 100vh;
  padding: 100px 20px 40px 20px;
}

.maintenance-container {
  max-width: 1200px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
}

.page-header h1 {
  font-size: 2.5rem;
}

.log-entry-btn {
  padding: 14px 30px;
  background: linear-gradient(135deg, #00d4ff, #00ff99);
  border: none;
  border-radius: 12px;
  color: #111;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.log-entry-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
}

.stats-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: #00ff99;
  margin: 10px 0;
}

.maintenance-log {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
}

.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.filter-tabs {
  display: flex;
  gap: 10px;
}

.tab {
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9rem;
}

.tab:hover,
.tab.active {
  background: rgba(0, 212, 255, 0.2);
  border-color: #00d4ff;
}

.log-timeline {
  position: relative;
  padding-left: 40px;
}

.log-timeline::before {
  content: '';
  position: absolute;
  left: 15px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, #00d4ff, #00ff99);
}

.log-item {
  position: relative;
  margin-bottom: 30px;
  padding: 20px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  border-left: 3px solid #00d4ff;
  transition: all 0.3s ease;
}

.log-item:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateX(5px);
}

.log-item::before {
  content: '';
  position: absolute;
  left: -43px;
  top: 25px;
  width: 14px;
  height: 14px;
  background: #00d4ff;
  border-radius: 50%;
  border: 3px solid #091020;
}

.log-item.emptied::before {
  background: #00ff99;
}

.log-item.repair::before {
  background: #ffaa00;
}

.log-item.alert::before {
  background: #ff4444;
}

.log-date {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-bottom: 8px;
}

.log-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.log-description {
  opacity: 0.8;
  line-height: 1.6;
  margin-bottom: 10px;
}

.log-meta {
  display: flex;
  gap: 20px;
  font-size: 0.85rem;
  opacity: 0.7;
}

.log-badge {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
}

.badge-emptied {
  background: rgba(0, 255, 153, 0.2);
  color: #00ff99;
}

.badge-repair {
  background: rgba(255, 170, 0, 0.2);
  color: #ffaa00;
}

.badge-alert {
  background: rgba(255, 68, 68, 0.2);
  color: #ff6b6b;
}

@media (max-width: 768px) {
  body {
    padding: 80px 20px 40px 20px;
  }
  
  .page-header {
    flex-direction: column;
    gap: 20px;
  }
  
  .log-entry-btn {
    width: 100%;
  }
}

/* Sidebar */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;}
.sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:rgba(12,16,30,0.97);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.06);padding:20px 12px;z-index:1000;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sidebar.active{transform:translateX(0);}
.close-btn{position:absolute;top:18px;right:14px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
.close-btn:hover{color:#ff6b6b;}
.nav-links{list-style:none;}
.nav-links li{margin-bottom:1px;}
.nav-links a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:rgba(255,255,255,0.6);text-decoration:none;border-radius:10px;transition:all 0.2s;font-size:0.88rem;}
.nav-links a:hover{background:rgba(255,255,255,0.05);color:#fff;}
.nav-links a.active{background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,255,136,0.06));color:#00d4ff;font-weight:500;border-left:3px solid #00d4ff;}
.nav-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.hamburger{position:fixed;top:18px;left:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:1.3rem;padding:7px 11px;border-radius:8px;cursor:pointer;z-index:999;backdrop-filter:blur(10px);transition:background 0.2s;}
.hamburger:hover{background:rgba(255,255,255,0.12);}
</style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="maintenance-container">
  <div class="page-header">
    <h1>🔧 Maintenance Logs</h1>
    <button class="log-entry-btn" onclick="alert('Manual log entries are not wired yet — the live activity feed below is real-time.')">+ Log Entry</button>
  </div>

  <div class="stats-overview">
    <div class="stat-card">
      <h3>Total Collections</h3>
      <div class="stat-value" id="statCollections">–</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">All time</p>
    </div>
    <div class="stat-card">
      <h3>Total Readings</h3>
      <div class="stat-value" id="statReadings">–</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">Sensor samples</p>
    </div>
    <div class="stat-card">
      <h3>Anomalies (7d)</h3>
      <div class="stat-value" id="statAnomalies">–</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">Spikes / drops detected</p>
    </div>
    <div class="stat-card">
      <h3>DB Size</h3>
      <div class="stat-value" id="statDbSize">–</div>
      <p style="opacity: 0.7; font-size: 0.9rem;">SQLite database</p>
    </div>
  </div>

  <div class="maintenance-log">
    <div class="log-header">
      <h2>Activity Timeline</h2>
      <div class="filter-tabs">
        <div class="tab active" data-filter="all">All</div>
        <div class="tab" data-filter="collections">Collections</div>
        <div class="tab" data-filter="alerts">Alerts</div>
        <div class="tab" data-filter="other">Other</div>
      </div>
    </div>

    <div class="log-timeline" id="timeline">
      <div style="text-align: center; padding: 30px; opacity: 0.6;">Loading activity…</div>
    </div>
  </div>
</div>

<script>
var ACTIVITY_CSS = {
  collection: { kind: 'emptied', badge: 'EMPTIED', cls: 'badge-emptied' },
  reset:     { kind: 'emptied', badge: 'EMPTIED', cls: 'badge-emptied' },
  alert:     { kind: 'alert',   badge: 'ALERT',   cls: 'badge-alert' },
  anomaly:   { kind: 'alert',   badge: 'ALERT',   cls: 'badge-alert' }
};
var OTHER_KIND = { kind: 'repair', badge: 'EVENT', cls: 'badge-repair' };

function fmtWhen(ts) {
  var d = new Date((ts || '').replace(' ', 'T'));
  if (isNaN(d)) return (ts || '');
  var sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return 'Just now';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
  if (sec < 604800) return Math.floor(sec / 86400) + 'd ago';
  return d.toLocaleDateString();
}

function loadMaintenance() {
  fetch('/api/activity?limit=30')
    .then(function(r) { return r.ok ? r.json() : []; })
    .then(function(items) {
      var tl = document.getElementById('timeline');
      if (!items.length) {
        tl.innerHTML = '<div style="text-align:center;padding:30px;opacity:0.6;">No activity yet — post sensor data to see events.</div>';
        return;
      }
      tl.innerHTML = '';
      items.forEach(function(ev) {
        var css = ACTIVITY_CSS[ev.event_type] || OTHER_KIND;
        var item = document.createElement('div');
        item.className = 'log-item ' + css.kind;
        item.dataset.filter = css.kind === 'alert' ? 'alerts' : (css.kind === 'emptied' ? 'collections' : 'other');
        item.innerHTML =
          '<div class="log-date">' + fmtWhen(ev.timestamp) + '</div>' +
          '<div class="log-title"><span class="log-badge ' + css.cls + '">' + css.badge + '</span> ' +
            '<span style="text-transform:capitalize;">' + (ev.event_type || 'event').replace(/_/g, ' ') + '</span></div>' +
          '<div class="log-description">' + (ev.message || '') + '</div>' +
          '<div class="log-meta"><span>🕒 ' + (ev.timestamp || '') + '</span></div>';
        tl.appendChild(item);
      });
    })
    .catch(function() {
      document.getElementById('timeline').innerHTML = '<div style="text-align:center;padding:30px;color:#ff6b6b;">Failed to load activity.</div>';
    });

  fetch('/api/stats').then(function(r) { return r.json(); }).then(function(s) {
    if (!s) return;
    var set = function(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; };
    set('statCollections', s.totalCollections != null ? s.totalCollections : '–');
    set('statReadings', s.totalReadings != null ? s.totalReadings : '–');
    set('statAnomalies', s.anomalyCount != null ? s.anomalyCount : '–');
  }).catch(function() {});

  fetch('/api/admin/stats').then(function(r) { return r.ok ? r.json() : null; }).then(function(a) {
    if (a && a.dbSizeMB != null) document.getElementById('statDbSize').textContent = a.dbSizeMB + ' MB';
  }).catch(function() {});
}

// Filter tabs
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    var filter = this.dataset.filter;
    document.querySelectorAll('#timeline .log-item').forEach(function(item) {
      item.style.display = (filter === 'all' || item.dataset.filter === filter) ? 'block' : 'none';
    });
  });
});

loadMaintenance();
setInterval(loadMaintenance, 30000);
</script>

</body>
</html>
